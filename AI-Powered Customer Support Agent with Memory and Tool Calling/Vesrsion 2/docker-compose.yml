version: '3.8'

services:
  # Main API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer-support-api
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DB_PATH=data/support.db
      - CHROMA_RAG_DIR=data/chroma_rag
      - CHROMA_MEM0_DIR=data/chroma_mem0
    volumes:
      - ./data:/app/data
      - ./knowledge_base:/app/knowledge_base
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - support-agent-network
    depends_on:
      - chroma

  # ChromaDB Vector Database
  chroma:
    image: chromadb/chroma:latest
    container_name: customer-support-chroma
    ports:
      - "8001:8000"
    environment:
      - CHROMA_DB_IMPL=duckdb+parquet
      - PERSIST_DIRECTORY=/chroma/data
      - IS_PERSISTENT=TRUE
    volumes:
      - chroma_data:/chroma/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - support-agent-network

volumes:
  chroma_data:
    driver: local

networks:
  support-agent-network:
    driver: bridge
